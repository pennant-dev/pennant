name: Pennant
options:
  bundleIdPrefix: dev.pennant
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  xcodeVersion: "27.0"
  groupSortPosition: top
configFiles:
  Debug: Apps/Signing.xcconfig
  Release: Apps/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
packages:
  Pennant:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: 2.6.4
  # Pennant Voice: neural speech on the Mac's GPU (MLX). Pinned to a commit: the package uses unsafe build flags,
  # which Xcode only accepts from a branch or revision.
  MLXAudio:
    url: https://github.com/Blaizzy/mlx-audio-swift
    revision: 8d86630ade569728aaea3dc1a29fc44e2efa719b
  # Held at the versions that commit was built and tested with (its Package.resolved): newer ones change APIs it uses.
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift.git
    exactVersion: 0.31.4
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    exactVersion: 3.31.4
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface.git
    exactVersion: 0.8.1
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers.git
    exactVersion: 1.1.9
targets:
  PennantMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/PennantMac
        excludes:
          - "Resources/LaunchAgents/**"
          - "Info.plist"
          - "*.entitlements"
      - path: Apps/PennantMac/Resources/LaunchAgents/dev.pennant.host.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
      # Pennant's Chrome extension, for "Load unpacked" (Settings › Pennant › Chrome).
      - path: Extensions/PennantChrome
        type: folder
        buildPhase: resources
    dependencies:
      - package: Pennant
        product: PennantCore
      - package: Pennant
        product: PennantClientKit
      - package: Pennant
        product: PennantUI
      - package: Sparkle
      - sdk: ServiceManagement.framework
      # Built first, then copied into Contents/Helpers by the script below.
      - target: PennantVoice
        embed: false
        link: false
    info:
      path: Apps/PennantMac/Info.plist
      # xcodegen rewrites Info.plist from these properties on every generate; edit them here, not in the file.
      properties:
        # The product's name everywhere macOS shows it (menu bar, Dock, About).
        CFBundleName: Pennant
        CFBundleDisplayName: Pennant
        # Substituted at build time so every release build gets a fresh bundle version (LaunchServices caches icons by it).
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        # macOS attributes Apple Events consent for the embedded Pennant Host helper to this app; without this
        # string the consent dialog is never shown and every AppleScript fails with -1743.
        NSAppleEventsUsageDescription: Pennant controls apps like Safari and Finder with Apple events to carry out the tasks you ask for.
        NSAccessibilityUsageDescription: Pennant reads on-screen controls and clicks and types for you.
        NSSystemAdministrationUsageDescription: Pennant runs commands you ask for on this Mac.
        NSLocalNetworkUsageDescription: Pennant finds and talks to Pennant hosts on your local network.
        NSMicrophoneUsageDescription: In Talk mode, Pennant listens to what you say to it.
        NSSpeechRecognitionUsageDescription: In Talk mode, what you say is turned into text on this Mac and sent to Pennant.
        NSBonjourServices: [_pennant._tcp]
        # Updates (Sparkle): the feed on pennant.dev, and the EdDSA key every update must be signed with.
        SUFeedURL: https://pennant.dev/appcast.xml
        SUPublicEDKey: Rd4MJ8/PdZTQlR0RBlAaxHbP0o6+ADTUyi6faPBYJDk=
        SUScheduledCheckInterval: 86400
        SUEnableSystemProfiling: false
    entitlements:
      path: Apps/PennantMac/PennantMac.entitlements
      properties:
        # Talk mode: the microphone, under the hardened runtime.
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pennant.mac
        PRODUCT_NAME: Pennant
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: 3
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Apps/PennantMac/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/PennantMac/PennantMac.entitlements
        SWIFT_EMIT_LOC_STRINGS: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    postBuildScripts:
      - name: Embed Pennant Host helper app
        basedOnDependencyAnalysis: false
        script: |
          set -e
          # Scripts/release.sh passes its universal build as PENNANT_HOST_BINARY; otherwise this Mac's own.
          SRC="${PENNANT_HOST_BINARY:-}"
          if [ -z "$SRC" ]; then
            for cfg in release debug; do
              if [ -x "${SRCROOT}/.build/${cfg}/pennant-host" ]; then SRC="${SRCROOT}/.build/${cfg}/pennant-host"; break; fi
            done
          fi
          if [ -z "$SRC" ]; then
            echo "warning: pennant-host not built yet (run: swift build -c release --product pennant-host); the app will look for it in .build/ at runtime"
            exit 0
          fi
          # The host ships as its own app bundle so macOS keys privacy grants by its bundle identifier
          # (dev.pennant.host) instead of by file path, and System Settings shows one stable "Pennant Host" entry.
          HELPER="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/Pennant Host.app"
          rm -rf "$HELPER"
          mkdir -p "$HELPER/Contents/MacOS"
          cp "$SRC" "$HELPER/Contents/MacOS/pennant-host"
          cp "${SRCROOT}/Sources/PennantHost/Info.plist" "$HELPER/Contents/Info.plist"
          # The host carries the app's version and build, so the app can tell a host left running from before an update.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${MARKETING_VERSION}" -c "Set :CFBundleVersion ${CURRENT_PROJECT_VERSION}" "$HELPER/Contents/Info.plist"
          mkdir -p "$HELPER/Contents/Resources"
          cp "${SRCROOT}/Sources/PennantHost/AppIcon.icns" "$HELPER/Contents/Resources/AppIcon.icns"
          printf 'APPL????' > "$HELPER/Contents/PkgInfo"
          rm -f "${BUILT_PRODUCTS_DIR}/${EXECUTABLE_FOLDER_PATH}/pennant-host"
          # Signed here, with its own entitlements and the hardened runtime, before Xcode signs the app around it;
          # a Developer ID export re-signs it and keeps them.
          if [ "${CODE_SIGNING_ALLOWED}" = "YES" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY}" ]; then
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --options runtime --timestamp=none \
              --entitlements "${SRCROOT}/Sources/PennantHost/PennantHost.entitlements" "$HELPER"
          fi
          echo "Embedded Pennant Host.app from $SRC"
      - name: Embed Pennant Voice helper app
        basedOnDependencyAnalysis: false
        script: |
          set -e
          # Talk mode's natural voice (Apple silicon only). Signed by its own target; copied in before Xcode signs the
          # app around it.
          SRC="${BUILT_PRODUCTS_DIR}/Pennant Voice.app"
          DEST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          rm -rf "$DEST/Pennant Voice.app"
          if [ ! -d "$SRC" ]; then
            echo "warning: Pennant Voice.app wasn't built; Talk mode will use the Mac's own voices"
            exit 0
          fi
          mkdir -p "$DEST"
          ditto "$SRC" "$DEST/Pennant Voice.app"
          echo "Embedded Pennant Voice.app"
  # Pennant Voice: the helper that runs Talk mode's natural voice (Kokoro, through MLX) in its own process. It reads
  # requests on stdin and writes audio on stdout; the app downloads the model (Settings › Pennant › Talk mode).
  PennantVoice:
    type: application
    platform: macOS
    sources:
      - path: Apps/PennantVoice
        excludes:
          - "Info.plist"
    dependencies:
      - package: MLXAudio
        product: MLXAudioTTS
      - package: MLXAudio
        product: MLXAudioCore
      - package: MLXAudio
        product: MLXAudioSTT
    info:
      path: Apps/PennantVoice/Info.plist
      properties:
        CFBundleName: Pennant Voice
        CFBundleDisplayName: Pennant Voice
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Started by the app with pipes, never from Finder: no Dock icon or menu bar.
        LSBackgroundOnly: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pennant.voice
        PRODUCT_NAME: Pennant Voice
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: 3
        # MLX runs on Apple silicon only; on an Intel Mac Talk mode keeps the system voices.
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Apps/PennantVoice/Info.plist
        # Shipped inside Pennant.app, not on its own.
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: NO
  PennantiOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Apps/PennantiOS
        excludes:
          - "Info.plist"
    dependencies:
      - package: Pennant
        product: PennantCore
      - package: Pennant
        product: PennantClientKit
      - package: Pennant
        product: PennantUI
    info:
      path: Apps/PennantiOS/Info.plist
      properties:
        # The name under the icon on the Home Screen.
        CFBundleName: Pennant
        CFBundleDisplayName: Pennant
        # Without these iOS blocks Bonjour browsing and the LAN websocket, so pairing can never complete.
        NSLocalNetworkUsageDescription: Pennant connects to your Mac over the local network to pair with it and stream its screen.
        NSBonjourServices: [_pennant._tcp]
        # The Mac's connect code (Settings › iPhone) is a QR code: scanned in the app, or opened from the Camera app.
        NSCameraUsageDescription: Pennant scans the connect code your Mac shows, to find it away from your network.
        NSMicrophoneUsageDescription: In Talk mode, Pennant listens to what you say to it.
        NSSpeechRecognitionUsageDescription: In Talk mode, what you say is turned into text on this iPhone and sent to Pennant.
        CFBundleURLTypes:
          - CFBundleURLName: dev.pennant.connect
            CFBundleURLSchemes: [pennant]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Only standard HTTPS/TLS: exempt, so TestFlight doesn't ask about export compliance on every build.
        ITSAppUsesNonExemptEncryption: false
        # The signing team, so the host can sign notifications without anyone typing it.
        PennantTeamID: $(DEVELOPMENT_TEAM)
    entitlements:
      path: Apps/PennantiOS/PennantiOS.entitlements
      properties:
        # Notifications (APNs). Archives for TestFlight and the App Store are re-signed for production.
        aps-environment: development
    settings:
      base:
        # Override at build time to ship under another App Store record: PENNANT_IOS_BUNDLE_ID=com.example.app
        PENNANT_IOS_BUNDLE_ID: dev.pennant.ios
        PRODUCT_BUNDLE_IDENTIFIER: $(PENNANT_IOS_BUNDLE_ID)
        PRODUCT_NAME: Pennant
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: 3
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Apps/PennantiOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PennantiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/PennantiOSUITests
    dependencies:
      - target: PennantiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pennant.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PennantiOS
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  PennantVoice:
    build:
      targets:
        PennantVoice: all
  PennantMac:
    build:
      targets:
        PennantMac: all
    run:
      config: Debug
      environmentVariables:
        PENNANT_PROJECT_DIR: $(SRCROOT)
  PennantiOS:
    build:
      targets:
        PennantiOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [PennantiOSUITests]
