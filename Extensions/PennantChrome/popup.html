<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --violet: #6B40D9; }
  body { font: 13px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; margin: 0; padding: 14px 16px; width: 260px; }
  h1 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 20px; height: 20px; border-radius: 5px; }
  .status { display: flex; align-items: center; gap: 7px; margin: 6px 0 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #aaa; }
  .dot.on { background: #3DB553; }
  p { margin: 0 0 10px; opacity: .75; line-height: 1.4; }
  button { font: inherit; border: 0; border-radius: 7px; padding: 6px 10px; background: var(--violet); color: white; cursor: pointer; }
</style>
</head>
<body>
  <h1><img src="icons/32.png" alt="">Pennant</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="line">Checking…</span></div>
  <p>Pennant works in tabs of its own, in a window of its own, with your sign-ins. Your pointer, keyboard and tabs stay yours.</p>
  <button id="show">Show Pennant's window</button>
  <script src="popup.js"></script>
</body>
</html>
