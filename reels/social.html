<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pennant: social card</title>
<!-- A 1280×640 card for GitHub's social preview and link previews (www/og.png is its 1200×630 crop). One frame:
     reelkit stills reels/social.html 0 -->
<link rel="stylesheet" href="/_reelkit/kit.css">
<link rel="stylesheet" href="brand.css">
<style>
.copy { position: absolute; left: 76px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
.brand { display: flex; align-items: center; gap: 16px; font: 850 32px/1 var(--rk-display); letter-spacing: -0.01em; }
.brand img { width: 64px; height: 64px; border-radius: 15px; box-shadow: 0 14px 30px -12px rgba(6, 3, 30, 0.8); }
h1 { margin-top: 34px; font: 900 68px/0.98 var(--rk-display); letter-spacing: -0.035em; }
h1 span { display: block; color: var(--rk-accent-soft); }
.line { margin-top: 26px; font: 500 23px/1.4 var(--rk-body); color: rgba(240, 236, 255, 0.85); max-width: 500px; }
.win { left: 690px; top: 90px; width: 700px; transform: rotate(-3deg); transform-origin: 0 0; }
</style>
</head>
<body>
<div id="frame">
  <div id="grain"></div>
  <div class="win light"><img class="shot" src="assets/shot-approval-pane.avif" alt=""></div>
  <div class="copy">
    <div class="brand"><img src="assets/icon-512.png" alt="">Pennant</div>
    <h1>The AI agent that <span>does the work.</span></h1>
    <p class="line">One open-source agent on your Mac: your jobs, your apps, your code, any model. Nothing is published, sent, deleted or paid for without you.</p>
  </div>
</div>
<script src="/_reelkit/kit.js"></script>
<script>Kit.start({ duration: 1, render: () => {}, width: 1280, height: 640 });</script>
</body>
</html>
